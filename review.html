<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review Sure Sound Entertainment</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/icon.png">
<style>html,body{margin:0;height:100%;background:#140a2e;color:#fff;font:15px/1.5 system-ui,-apple-system,sans-serif}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}.msg{max-width:420px;margin:0 auto;padding:80px 20px;text-align:center}</style>
</head>
<body>
<div class="msg" id="msg" hidden>This review link isn’t complete. Please use the link from your email.</div>
<script>
  // The customer's private review link: /review?t=<token>. Shows the review form from the booking system.
  (function () {
    var APP = 'https://script.google.com/macros/s/AKfycbxLS-IIOH44aT39Q39Xxf_bfqK8gNn6OsWADENd1NZpMAix6oBZUWjBpc4XDqFuuDZq/exec';
    var t = (new URLSearchParams(location.search).get('t') || '').toLowerCase();
    if (!/^[a-f0-9]{40}$/.test(t)) { document.getElementById('msg').hidden = false; return; }
    var url = APP + '?page=review&t=' + t;
    // Facebook, Instagram and similar in-app browsers can leave the form blank inside this page
    if (/FBAN|FBAV|FB_IAB|FBIOS|FB4A|Instagram|Messenger|MicroMessenger|Line\/|TikTok|musical_ly|Snapchat|; wv\)/i.test(navigator.userAgent || '')) { location.replace(url); return; }
    var f = document.createElement('iframe');
    f.title = 'Leave a review for Sure Sound Entertainment';
    f.src = url;
    document.body.appendChild(f);
  })();
</script>
<script>
  // Keep Netlify's "Powered by Netlify" badge in the bottom-right corner, out of the way of the page header.
  (function () {
    function place() {
      var b = document.getElementById('nl-badge-frame');
      if (!b) return;
      if (!b.__watched) { b.__watched = true; new MutationObserver(place).observe(b, { attributes: true, attributeFilter: ['style'] }); }
      var s = b.style, want = { top: 'auto', left: 'auto', right: '12px', bottom: 'calc(12px + env(safe-area-inset-bottom, 0px))' };
      for (var k in want) if (s.getPropertyValue(k) !== want[k] || s.getPropertyPriority(k) !== 'important') s.setProperty(k, want[k], 'important');
    }
    place();
    new MutationObserver(place).observe(document.documentElement, { childList: true, subtree: true });
    var n = 0, t = setInterval(function () { place(); if (++n > 30) clearInterval(t); }, 500);
  })();
</script>
</body>
</html>
